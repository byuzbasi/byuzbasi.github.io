name: Deploy website to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  push:
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Provide permission to clone the repo and deploy it to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build al-folio website
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: al-folio-site
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Prepare academic sources
        run: |
          cp publications.bib al-folio-site/_bibliography/papers.bib
          mkdir -p al-folio-site/assets/files/kurs
          cp -R content/en/kurs/temel-spss-kurs al-folio-site/assets/files/kurs/
      - name: Build with Jekyll
        run: |
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        working-directory: al-folio-site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./al-folio-site/_site

  # Deploy website to GitHub Pages hosting
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

- id: ridge-liu-correlation-risk
  title:
    tr: Değişen açıklayıcı korelasyonlarında Ridge ve Liu tahmin riski
    en: Ridge and Liu prediction risk under changing predictor correlations
  description:
    tr: Çoklu doğrusal bağlantı altında yanlı tahminciler konulu kitap bölümü için Python kodu, sabitlenmiş çalışma tasarımı ve yeniden üretim yönergeleri. Kaynak ve hedef açıklayıcı korelasyonları değiştiğinde tahmin riskini inceler.
    en: Python code, frozen study configuration and reproduction instructions for a chapter on biased estimators under multicollinearity. Examines prediction risk as source and target predictor correlations change.
  technologies: Python
  source_url: https://github.com/byuzbasi/ridge-liu-correlation-risk
  verified_links:

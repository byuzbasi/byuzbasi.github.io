- id: ess-selective-prediction
  title:
    tr: Avrupa Sosyal Araştırması ülkelerinde tahmin kapsamı
    en: Prediction coverage across European Social Survey countries
  description:
    tr: On dokuz ülkede CES-D-8 puanlarının tahmin kapsamını eğitim ve göç grupları açısından inceleyen araştırmanın kodu ve ESS veri kaynakları. CatBoost ve TabM için ortak tahmin kapasitesi ve yerel kalibrasyon tasarımı kullanılır.
    en: Analysis code and ESS data sources for a study of educational and migration differences in CES-D-8 prediction coverage across 19 countries. CatBoost and TabM share a common prediction capacity and local calibration design.
  technologies: Python · R
  source_url: https://github.com/byuzbasi/ess-selective-prediction
  verified_links:
    source_url: '2026-11-18'


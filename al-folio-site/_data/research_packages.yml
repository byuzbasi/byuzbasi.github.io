  name: LHWL
  subtitle: Lorentz Hyperbolic Weighted Learning
  description:
    tr: Lorentz hiperbolik temsilleri üzerinde yerel regresyon ve cezalı öğrenme. Gaussian ve binomial modeller, parametre seçimi, tanılar ve katsayı haritaları sunar; temsillerin coğrafi olması gerekmez.

- id: softridge
  related_projects: []
  verified_links:
    source_url: '2026-10-25'
    docs: '2026-10-25'
    guide: '2026-10-25'
  name: softridge
  subtitle: Soft-Thresholded Ridge Estimation
  description:
    tr: Yüksek boyutlu doğrusal regresyonda yumuşak eşiklemeli ridge kestirimi. Sabit ayarlı Gauss modellerinde kestirilebilir izdüşüm için katsayı riskini ve tahmin için SURE değerini hesaplar; çapraz doğrulama ve en küçük karelerle yeniden uyum araçları sunar.
    en: Soft-thresholded ridge estimation for high-dimensional linear regression. Computes fixed-tuning Gaussian coefficient risk for the estimable projection and prediction SURE, with cross-validation and least-squares refitting.
  technologies: R · C++17 · RcppArmadillo
  source_url: https://github.com/byuzbasi/softridge
  source_version: '0.3.0.1'
  citation: 'Arashi, M. and Yuzbasi, B. (2026). softridge: High-Dimensional Ridge Shrinkage and Selection by Soft Thresholding. R package version 0.3.0.1.'
  docs:
    path: /softridge/
    guide_path: /softridge/articles/getting-started.html
    published: true
    status:
      tr: Dokümantasyon, örnekler ve yeniden üretim rehberleri yayında
      en: Documentation, examples and reproduction guides available

- id: scaleCorrection
  related_projects: []
  verified_links:
    source_url: '2026-10-25'
    docs: '2026-10-25'
    guide: '2026-10-25'
  name: scaleCorrection
  subtitle: Optimism-Corrected Ridge Scaling
  description:
    tr: softridge için eşlikçi araştırma paketi. Yumuşak eşikleme sonrasında iyimserlik düzeltmeli ölçeklendirme uygular; SSTR ve eşleştirilmiş Ridge-c0 yöntemlerini ortak bir çapraz doğrulama yüzeyinde karşılaştırır. Düzeltmenin başarımı ampirik olarak değerlendirilir.
    en: A research companion to softridge. Applies optimism-corrected scaling after soft thresholding and tunes SSTR alongside a matched Ridge-c0 control on a shared cross-validation surface. The correction is evaluated empirically.
  technologies: R · C++17 · RcppArmadillo
  source_url: https://github.com/byuzbasi/softridge/tree/main/companion/scaleCorrection
  source_version: '0.1.0'
  citation: 'Arashi, M. and Yuzbasi, B. (2026). scaleCorrection: Research Companion for Optimism-Corrected Ridge Scaling. R package version 0.1.0.'

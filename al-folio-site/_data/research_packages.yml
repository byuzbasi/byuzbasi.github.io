  subtitle: Adaptive Regional Functional Regression
  description:
    tr: Fonksiyonel açıklayıcılardan skaler yanıtı modelleyen regresyonda adaptif bölgesel seyreklik. MCP ve SCAD cezalarıyla tek ve çok çözünürlüklü bölgesel kestirim, bağımsız doğrulama örneklemiyle model seçimi ve sabit çözünürlüklü fMCP/fSCAD yöntemleri sunar.
    en: Adaptive regional sparsity for scalar-on-function regression. Provides single- and multi-resolution regional estimation with MCP and SCAD penalties, model selection using an independent validation sample, and fixed-resolution fMCP/fSCAD estimators.

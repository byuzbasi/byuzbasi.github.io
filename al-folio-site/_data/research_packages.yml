  name: gwrs
  subtitle: Fast Geographically Weighted Regression and Selection
  description:
    tr: Coğrafi ağırlıklı regresyonda değişken alt kümesi, çekirdek ve bant genişliğinin ortak seçimi; Ridge, Lasso, Elastic Net, SCAD ve MCP ile yerel düzenlileştirme. Mekânsal çapraz doğrulama ve yeni konumlarda tahmin sunar.
    en: Joint selection of predictor subsets, kernels and bandwidths in geographically weighted regression, with local Ridge, Lasso, Elastic Net, SCAD and MCP regularization. Includes spatial cross-validation and prediction at new locations.

  verified_links:
    source_url: '2026-09-20'
  name: BernoulliRuns
  subtitle: Exact Run-Count Distributions for Independent Bernoulli Trials
  description:
    tr: Başarı olasılıkları konuma göre değişebilen bağımsız Bernoulli denemelerinde toplam dizi (run) sayısının kesin dağılımını hesaplar. Olasılık kütle ve dağılım fonksiyonları, beklenen değer ve tek yönlü kuyruk olasılıkları sunar.
    en: Computes exact distributions of the total run count for independent Bernoulli trials with possibly different success probabilities. Provides probability masses, cumulative probabilities, expectations and one-sided tails.

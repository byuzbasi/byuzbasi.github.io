  name: emaxProjection
  subtitle: Confidence-Region Projection for Integrated Emax Responses
  description:
    tr: Belirtilen bir doz ekseninde bütünleşik Emax yanıtı için güven bölgesi izdüşümü. Düz, doğrusal ve anlık doyum sınırlarını kapsar; dış aralıkları, uygulanabilir çözümleri, uç nokta açıklıklarını ve hesaplamanın sonlanma durumunu raporlar.
    en: Confidence-region projection for an integrated Emax response on a specified dose axis. Includes flat, linear and immediate-saturation limits, and reports outer intervals, feasible witnesses, endpoint gaps and termination status.
  technologies: R · C++17 · RcppArmadillo
  source_url: https://github.com/byuzbasi/emaxProjection

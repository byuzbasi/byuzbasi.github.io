    - TÜBİTAK'ın aynı anda birden fazla projede bursiyer olmaya ilişkin hükümleri uygulanır.
    - BİDEB'den kısmi burs alanlara proje kapsamında ayrıca burs ödemesi yapılamaz.
    - Fiilî burs tutarı; öğrencinin çalışma durumu, nihai proje sözleşmesi ve yürürlükteki TÜBİTAK kurallarına göre belirlenir.
  scholarship_conditions_en:
    - TÜBİTAK rules on holding scholarships in more than one project apply.
    - Students receiving a partial BİDEB scholarship cannot receive an additional scholarship from this project.
    - Actual payments depend on employment status, the final project agreement and the TÜBİTAK rules in force.

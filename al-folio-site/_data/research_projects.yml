  candidate_profile:
    - İstatistik, ekonometri, matematik, veri bilimi, bilgisayar bilimleri veya ilgili bir alanda yüksek lisans ya da doktora öğrencisi olmak.
    - Eğitim alanı veya tez konusu itibarıyla proje konusuyla ilişkili olmak.
    - R veya Python ile programlama; makine öğrenmesi, mekânsal veri analizi ya da yeniden üretilebilir araştırmaya ilgi duymak.
    - Kısa özgeçmiş, transkript ve araştırma ilgisini açıklayan kısa bir metin sunmak.
  candidate_profile_en:
    - Be enrolled in a master's or PhD programme in statistics, econometrics, mathematics, data science, computer science or a related field.
